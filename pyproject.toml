[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunter"
version = "0.2.0"
description = "Personal job search: collect, rank, tailor, reach out, track."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "supabase>=2.6",
  "pyjwt[crypto]>=2.9",
  "openai>=1.40",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "pyyaml>=6",
  "numpy>=1.26",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "apscheduler>=3.10,<4",
  "plyer>=2.1",
  "google-api-python-client>=2.130",
  "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]
dev = ["pytest>=8", "responses>=0.25", "httpx>=0.27"]

[project.scripts]
jobhunter = "jobhunter.interfaces.cli:main"

[tool.setuptools.packages.find]
include = ["jobhunter*"]

[tool.setuptools.package-data]
"jobhunter.infrastructure.documents" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
